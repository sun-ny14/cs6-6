<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-6 전자칠판</title>
    <style>
        :root{
            --navy:#182844;
            --blue:#3498db;
            --green:#27ae60;
            --red:#e74c3c;
            --yellow:#f1c40f;
            --purple:#8e44ad;
            --paper:#f5f7fb;
        }
        *{box-sizing:border-box}
        body{margin:0;background:linear-gradient(145deg,#eef4fb,#f8f4e8);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;color:var(--navy);min-height:100vh}
        button,input,textarea{font:inherit}
        #bb-app{width:min(1800px,100%);min-height:100vh;margin:auto;padding:24px 30px 36px}
        .topbar{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:18px}
        .brand{display:flex;align-items:center;gap:16px}.brand-mark{display:grid;place-items:center;width:66px;height:66px;border-radius:20px;background:var(--navy);color:white;font-size:35px;box-shadow:0 10px 25px #18284433}
        .brand h1{margin:0;font-size:clamp(30px,3vw,52px);letter-spacing:-1px}.date{margin:4px 0 0;color:#6c778a;font-size:20px;font-weight:800}
        .clock-small{font-size:clamp(34px,4vw,64px);font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:-2px}
        .notice{display:none;margin-bottom:20px;padding:16px 20px;border:3px solid #e5b700;border-radius:18px;background:#fff8d9;box-shadow:0 8px 20px #8a720f22}.notice.is-visible{display:grid;grid-template-columns:auto 1fr;align-items:start;gap:16px}.notice b{display:inline-grid;place-items:center;min-width:78px;padding:9px 14px;border-radius:12px;background:#f1c40f;color:#3f3500;font-size:24px;font-weight:950}.notice span{padding:7px 0;color:#182844;font-size:clamp(25px,2.2vw,38px);font-weight:950;line-height:1.4;white-space:pre-wrap}
        .board-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}.schedule-rail{position:sticky;top:18px;display:grid;gap:12px}.timeline{display:grid;grid-template-columns:1fr;gap:8px}.period-chip{padding:11px 12px;border-radius:13px;background:white;border:2px solid #dbe2ec;text-align:left;box-shadow:0 4px 12px #26364d10;cursor:pointer;font:inherit;color:inherit}.period-chip:hover{border-color:var(--blue);transform:translateX(3px)}.period-chip strong{display:inline-block;min-width:76px;font-size:17px}.period-chip span{display:inline;font-size:14px;color:#6f7a8c;font-weight:800}.period-chip.is-active{background:var(--navy);color:white;border-color:var(--navy);transform:translateX(4px)}.period-chip.is-active span{color:#dce8fa}.period-chip.is-manual{outline:4px solid #f1c40f;outline-offset:2px}
        .viewer-controls{display:grid;gap:10px;padding:14px;border-radius:12px;background:#eaf1f8;color:#52627a;font-size:15px;font-weight:850;line-height:1.45}.viewer-controls.manual{background:#fff4c7;color:#6e5600}.viewer-controls button{width:100%;padding:10px 12px;border:0;border-radius:8px;background:var(--navy);color:white;font-weight:900;cursor:pointer}
        .stage{min-height:calc(100vh - 245px);padding:30px;border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 18px 45px #1e30451f;border:1px solid #fff;overflow:hidden}
        .state-kicker{text-align:center;font-size:20px;font-weight:900;color:var(--blue);margin-bottom:8px}.state-title{text-align:center;margin:0;font-size:clamp(38px,5vw,78px);line-height:1.1;letter-spacing:-2px}.state-subtitle{text-align:center;margin:15px auto 0;max-width:1200px;font-size:clamp(22px,2.5vw,38px);font-weight:800;white-space:pre-wrap;line-height:1.45;color:#4a5870}.state-subtitle.simple-action{margin-top:24px;font-size:clamp(34px,4vw,62px);font-weight:950;color:#35445e}
        .break-clock{text-align:center;margin:30px 0 5px;font-size:clamp(90px,14vw,210px);line-height:1;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:-8px}.break-message{text-align:center;margin:15px 0;font-size:clamp(40px,6vw,90px);font-weight:950}.break-message.prepare{color:var(--red)}.break-message.move{color:var(--purple)}.next-class{text-align:center;font-size:25px;font-weight:850;color:#69758a}
        .summary-row{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:22px 0}.summary-pill{padding:10px 20px;border-radius:999px;background:#edf2f8;font-size:20px;font-weight:900}.summary-pill.good{background:#e8f7ee;color:#187a40}.summary-pill.bad{background:#fdecea;color:#b4392d}
        .seat-grid{display:grid;grid-template-columns:repeat(var(--seat-cols),minmax(125px,1fr));gap:13px;margin-top:22px}.seat{min-height:105px;padding:13px;border-radius:16px;border:3px solid #d5dce6;background:#f7f9fc;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.seat.empty{opacity:.38;border-style:dashed}.seat.good{background:#e8f8ef;border-color:#2ecc71}.seat.bad{background:#fdecea;border-color:#e74c3c}.seat.wait{background:#fff4df;border-color:#f39c12}.seat-name{font-size:clamp(20px,2vw,31px);font-weight:950}.seat-state{margin-top:7px;font-size:16px;font-weight:900}.seat.good .seat-state{color:#187a40}.seat.bad .seat-state{color:#b4392d}.seat.wait .seat-state{color:#a05e00}.seat-number{font-size:13px;color:#7d8797;font-weight:800;margin-bottom:3px}
        .action{max-width:1300px;margin:22px auto 0;padding:20px;border-radius:16px;background:#eaf3fb;font-size:clamp(23px,2.5vw,38px);font-weight:850;white-space:pre-wrap;text-align:center}.inline-memo-card{max-width:1300px;margin:28px auto 0;padding:26px 30px;border-radius:24px;background:#fff9df;border:4px solid #e0b92f;box-shadow:0 12px 30px #8a720f20}.inline-memo-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px;color:#745b00;font-size:clamp(23px,2.4vw,36px);font-weight:950}.inline-memo-status{font-size:15px;color:#8a7426}.inline-memo-input{display:block;width:100%;min-height:235px;padding:18px 20px;border:2px solid #d5b62d;border-radius:15px;background:#fffef7;color:var(--navy);font:inherit;font-size:clamp(24px,2.8vw,42px);font-weight:800;line-height:1.5;box-sizing:border-box;resize:vertical}.inline-memo-input:focus{outline:4px solid #f3d55a;outline-offset:2px}.inline-memo-view{min-height:190px;padding:18px 20px;border-radius:15px;background:#fffef7;font-size:clamp(24px,2.8vw,42px);font-weight:850;line-height:1.5;white-space:pre-wrap}.inline-memo-empty{color:#9b8c50;font-weight:750}
        .empty-message{display:grid;place-items:center;min-height:300px;font-size:34px;font-weight:900;color:#778297;text-align:center}
        .dismissal-board{max-width:1350px;margin:0 auto}.dismissal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:26px}.dismissal-card{padding:24px;border-radius:22px;border:3px solid #dfe5ed;background:#f8fafc}.dismissal-card.clean{border-color:#48b879;background:#effbf4}.dismissal-card.task{border-color:#f0a84a;background:#fff7e8}.dismissal-card.manual{grid-column:1/-1;border-color:#9b7ae5;background:#f6f1ff}.dismissal-card h3{margin:0 0 14px;font-size:clamp(23px,2.3vw,36px)}.number-list{font-size:clamp(34px,5vw,74px);font-weight:950;line-height:1.25;color:#b43d31;word-break:keep-all}.number-list.all-done{color:#18864b}.task-due-item{padding:13px 0;border-top:2px dashed #e4c189}.task-due-item:first-of-type{border-top:0}.task-due-title{font-size:clamp(21px,2vw,31px);font-weight:950}.task-due-numbers{margin-top:7px;font-size:clamp(27px,3vw,48px);font-weight:950;color:#b43d31}.dismissal-input{width:100%;min-height:95px;padding:16px;border:2px solid #a98de7;border-radius:13px;background:white;font-size:clamp(25px,3vw,44px);font-weight:900;resize:vertical}.dismissal-status{margin-top:8px;color:#66548b;font-weight:800}.dismissal-view{min-height:70px;font-size:clamp(30px,4vw,58px);font-weight:950;color:#b43d31;white-space:pre-wrap}
        @media(max-width:1100px){#bb-app{padding:16px}.board-layout{grid-template-columns:205px minmax(0,1fr)}.period-chip strong{display:block}.period-chip span{display:block;margin-top:3px}.stage{min-height:650px;padding:22px}.seat-grid{grid-template-columns:repeat(var(--seat-cols),minmax(95px,1fr))}.dismissal-grid{grid-template-columns:1fr}.dismissal-card.manual{grid-column:auto}}
        @media(max-width:760px){.board-layout{grid-template-columns:1fr}.schedule-rail{position:static}.timeline{grid-template-columns:repeat(2,1fr)}.notice.is-visible{grid-template-columns:1fr}.notice b{justify-self:start}}
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
    <main id="bb-app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">🏫</div>
                <div><h1>6-6 전자칠판</h1><p class="date" id="date-display"></p></div>
            </div>
            <time class="clock-small" id="clock-display">00:00:00</time>
        </header>
        <p id="bb-sync-status" role="status" style="font-weight:800;line-height:1.5"></p>
        <section class="notice" id="notice-display"><b>공지</b><span></span></section>
        <div class="board-layout">
            <aside class="schedule-rail">
                <nav class="timeline" id="timeline" aria-label="오늘 시간표"></nav>
                <section class="viewer-controls" id="viewer-controls"></section>
            </aside>
            <section class="stage" id="stage"><div class="empty-message">전자칠판 정보를 불러오는 중입니다.</div></section>
        </div>
    </main>

    <script src="js/firebase-config.js?v=20260831-3"></script>
    <script type="text/plain" id="legacy-blackboard-script">
        (function(){
            'use strict';

            const PERIODS=['아침','1교시','2교시','3교시','4교시','점심시간','청소시간','5교시','6교시'];
            const DEFAULTS={
                '아침':{startTime:'08:00',endTime:'09:00',subject:'아침'},
                '1교시':{startTime:'09:00',endTime:'09:40',subject:'1교시'},
                '2교시':{startTime:'09:50',endTime:'10:30',subject:'2교시'},
                '3교시':{startTime:'10:40',endTime:'11:20',subject:'3교시'},
                '4교시':{startTime:'11:30',endTime:'12:10',subject:'4교시'},
                '점심시간':{startTime:'12:10',endTime:'13:00',subject:'점심시간'},
                '청소시간':{startTime:'13:00',endTime:'13:20',subject:'청소시간'},
                '5교시':{startTime:'13:20',endTime:'14:00',subject:'5교시'},
                '6교시':{startTime:'14:10',endTime:'14:50',subject:'6교시'}
            };
            const state={schedule:{},notice:'',users:[],checkins:{},seatData:{},cleaningRoot:{}};

            function escapeHtml(value){return String(value==null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
            function toMinutes(value){const [hour,minute]=String(value||'').split(':').map(Number);return Number.isFinite(hour)&&Number.isFinite(minute)?hour*60+minute:null;}
            function koreanNow(){const shifted=new Date(Date.now()+9*60*60*1000);return {date:shifted.toISOString().slice(0,10),hour:shifted.getUTCHours(),minute:shifted.getUTCMinutes(),second:shifted.getUTCSeconds(),day:shifted.getUTCDay()};}
            function pad(value){return String(value).padStart(2,'0');}
            function isClassPeriod(name){return /^\d교시$/.test(name);}
            function periodData(name){const defaults=DEFAULTS[name];const saved=state.schedule[name]||{};return {...defaults,...saved,subject:saved.subject||defaults.subject,startTime:saved.startTime||defaults.startTime,endTime:saved.endTime||defaults.endTime};}
            function getTimeline(){return PERIODS.map(name=>{const data=periodData(name);return {name,...data,start:toMinutes(data.startTime),end:toMinutes(data.endTime)};}).filter(item=>item.start!==null&&item.end!==null&&item.end>item.start);}
            function getMode(nowMinutes){const timeline=getTimeline();const active=timeline.find(item=>nowMinutes>=item.start&&nowMinutes<item.end);if(active)return {type:'period',active,timeline};const next=timeline.find(item=>item.start>nowMinutes);if(next)return {type:'break',next,minutesUntil:next.start-nowMinutes,timeline};return {type:'finished',timeline};}
            function getCheckedNames(today){const checked=new Set();Object.entries(state.checkins||{}).forEach(([key,value])=>{const item=value||{};const date=String(item.date||item.checkinDate||'').slice(0,10);const name=String(item.name||item.user||item.userName||'').trim();if(date===today&&name)checked.add(name);});return checked;}
            function getSeats(){const data=state.seatData||{};const config=data.config||{};const layout=data.layout||{};const rows=Number(config.rows||data.rows)||6;const cols=Number(config.cols||data.cols)||5;const seats=[];for(let row=0;row<rows;row+=1){for(let col=0;col<cols;col+=1){const key=`${row}-${col}`;const raw=layout[key]||layout[`seat-${row}-${col}`];const name=typeof raw==='string'?raw.trim():String(raw&&(raw.name||raw.studentName)||'').trim();seats.push({row,col,key,name});}}return {rows,cols,seats};}
            function renderTimeline(activeName){const container=document.getElementById('timeline');container.innerHTML=PERIODS.map(name=>{const data=periodData(name);return `<div class="period-chip${name===activeName?' is-active':''}"><strong>${escapeHtml(name)}</strong><span>${escapeHtml(data.startTime||'--:--')} · ${escapeHtml(data.subject||name)}</span></div>`;}).join('');}
            function renderNotice(){const notice=document.getElementById('notice-display');const text=String(state.notice||'').trim();notice.classList.toggle('is-visible',Boolean(text));notice.querySelector('span').textContent=text;}
            function renderSeatGrid(mode,today){const seatInfo=getSeats();const checked=getCheckedNames(today);const cleaning=state.cleaningRoot?.[today]||{};let completed=0;const cards=seatInfo.seats.map(seat=>{if(!seat.name)return `<div class="seat empty"><span class="seat-number">${seat.row+1}-${seat.col+1}</span><span class="seat-name">빈자리</span></div>`;let good=false;let label='';if(mode==='morning'){good=checked.has(seat.name);label=good?'등교 완료':'미등교';}else{good=Boolean(cleaning[seat.name]&&cleaning[seat.name].cleanDone);if(good)completed+=1;label=good?'청소 확인 완료':'확인 전';}return `<article class="seat ${good?'good':mode==='morning'?'bad':'wait'}"><span class="seat-number">${seat.row+1}-${seat.col+1}</span><strong class="seat-name">${escapeHtml(seat.name)}</strong><span class="seat-state">${label}</span></article>`;}).join('');const occupied=seatInfo.seats.filter(seat=>seat.name).length;const goodCount=mode==='morning'?seatInfo.seats.filter(seat=>seat.name&&checked.has(seat.name)).length:completed;const badCount=Math.max(0,occupied-goodCount);const title=mode==='morning'?'아침 등교 확인':'청소 확인';const guide=mode==='morning'?'자기 이름이 초록색인지 확인하세요.':'자리 청소가 확인되면 초록색으로 바뀝니다.';return `<div class="state-kicker">${title}</div><h2 class="state-title">${guide}</h2><div class="summary-row"><span class="summary-pill good">완료 ${goodCount}명</span><span class="summary-pill ${badCount?'bad':'good'}">${mode==='morning'?'미등교':'확인 전'} ${badCount}명</span></div><div class="seat-grid" style="--seat-cols:${seatInfo.cols}">${cards}</div>`;}
            function renderLesson(item){const subject=String(item.subject||item.name).trim();const action=String(item.action||'').trim();const note=String(item.learningNote||'').trim();return `<div class="state-kicker">${escapeHtml(item.name)} 수업 중</div><h2 class="state-title">${escapeHtml(subject)}</h2><section class="lesson-card"><div class="lesson-label">현재 수업</div><div class="lesson-subject">${escapeHtml(item.name)} ${escapeHtml(subject)}</div>${action?`<div class="action">${escapeHtml(action)}</div>`:''}</section>${item.showLearningNote&&note?`<section class="learning-note"><h3>📖 ${escapeHtml(item.name)} ${escapeHtml(subject)} · 배움공책</h3><p>${escapeHtml(note)}</p></section>`:''}`;}
            function renderSimplePeriod(item){const action=String(item.action||'').trim();const icon=item.name==='점심시간'?'🍱':'☀️';return `<div class="state-kicker">${escapeHtml(item.name)}</div><h2 class="state-title">${icon} ${escapeHtml(item.subject||item.name)}</h2>${action?`<p class="state-subtitle">${escapeHtml(action)}</p>`:''}`;}
            function renderBreak(mode,timeText){const next=mode.next;const moving=isClassPeriod(next.name)&&Boolean(next.isMovingClass);let message='쉬는 시간입니다.';let tone='';if(moving&&mode.minutesUntil<=5){message='이동수업입니다. 줄 서세요.';tone='move';}else if(isClassPeriod(next.name)&&mode.minutesUntil<=2){message='수업 준비하세요.';tone='prepare';}return `<div class="break-clock">${timeText.slice(0,5)}</div><div class="break-message ${tone}">${message}</div><div class="next-class">다음 시간 · ${escapeHtml(next.name)} ${escapeHtml(next.subject||next.name)} · ${escapeHtml(next.startTime)}</div>`;}
            function render(){const now=koreanNow();const currentMinutes=now.hour*60+now.minute;const timeText=`${pad(now.hour)}:${pad(now.minute)}:${pad(now.second)}`;const dateText=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());document.getElementById('clock-display').textContent=timeText;document.getElementById('date-display').textContent=dateText;renderNotice();const mode=getMode(currentMinutes);const stage=document.getElementById('stage');if(mode.type==='period'){renderTimeline(mode.active.name);if(mode.active.name==='아침'){stage.innerHTML=renderSeatGrid('morning',now.date);}else if(mode.active.name==='청소시간'){stage.innerHTML=renderSeatGrid('cleaning',now.date);}else if(isClassPeriod(mode.active.name)){stage.innerHTML=renderLesson(mode.active);}else{stage.innerHTML=renderSimplePeriod(mode.active);}}else if(mode.type==='break'){renderTimeline('');stage.innerHTML=renderBreak(mode,timeText);}else{renderTimeline('');stage.innerHTML='<div class="empty-message">오늘의 학교 일정이 끝났습니다.</div>';}}
            function listen(path,key){db.ref(path).on('value',snapshot=>{const value=snapshot.val();state[key]=value==null?(key==='notice'?'':{}):value;render();},error=>{console.error(path+' 불러오기 실패:',error);});}

            listen('blackboard/schedule','schedule');
            listen('blackboard/notice','notice');
            listen('users','users');
            listen('checkins','checkins');
            listen('seatLayoutData','seatData');
            listen('classManagement/cleaningStatus','cleaningRoot');
            render();
            setInterval(render,1000);
        })();
    </script>
    <script src="js/blackboard-share.js?v=20260902-share-1"></script>
    <script src="js/blackboard-display.js?v=20260902-share-1"></script>
</body>
</html>
