<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-6 용사 본부</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* 애니메이션 */
        @keyframes bounceAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .bouncing-text { display: inline-block; animation: bounceAnim 0.6s ease-in-out infinite; }
        
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; font-size: 19px !important; }
        #main-app { display: flex !important; flex-direction: row !important; width: 100% !important; min-height: 100vh !important; }
        
        .sidebar-menu { width: 300px !important; min-width: 300px !important; background: #ffffff !important; border-right: 1px solid #e0e0e0 !important; padding: 30px 18px !important; gap: 14px !important; }
        .sidebar-menu button { width: 100% !important; text-align: left !important; padding: 18px 22px !important; border: none !important; background: transparent !important; border-radius: 12px !important; font-size: 1.3rem !important; font-weight: bold !important; cursor: pointer !important; }
        .sidebar-menu button:hover { background: #f1f3f5 !important; }
        
        .main-content-area { flex: 1 !important; padding: 40px !important; }
        
        h1 { font-size: 2.5rem !important; }
        h2 { font-size: 2.2rem !important; }
        h3 { font-size: 1.7rem !important; }
        p, span, label, input, button, table th, table td { font-size: 1.25rem !important; }
        
        .horizontal-box { display: flex; flex-direction: row; align-items: center; gap: 15px; flex-wrap: wrap; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        #sidebar-toggle-btn { position: fixed !important; top: 30px !important; left: 300px !important; z-index: 9999 !important; background: #2c3e50 !important; color: white !important; border: none !important; border-radius: 0 12px 12px 0 !important; width: 42px !important; height: 65px !important; font-size: 1.5rem !important; cursor: pointer !important; }
    </style>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-menu');
            sidebar.classList.toggle('collapsed');
            document.getElementById('sidebar-toggle-btn').innerText = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        }
    </script>
</head>
<body>
    <!-- 로딩 화면 -->
    <div id="loading-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:99999; font-size:2.2rem; font-weight:bold; gap: 15px;">
        <div style="font-size: 3.5rem;">🏰</div>
        <div style="display: flex; gap: 5px;">
            <span class="bouncing-text" style="color: #2c3e50;">용</span><span class="bouncing-text" style="color: #3498db;">사</span>
            <span class="bouncing-text" style="color: #2c3e50;">본</span><span class="bouncing-text" style="color: #e74c3c;">부</span>
            <span class="bouncing-text" style="color: #f1c40f;">접</span><span class="bouncing-text" style="color: #2ecc71;">속</span>
            <span class="bouncing-text" style="color: #34495e;">중</span>
        </div>
    </div>

    <div id="main-app">
        <button id="sidebar-toggle-btn" onclick="toggleSidebar()">◀</button>
        <nav id="sidebar-menu" class="sidebar-menu">
            <h2 style="text-align: center; color: #2c3e50;">🏰 6-6 본부</h2>
            <button onclick="showTab('main')">🤺 용사들</button>
            <button onclick="showTab('shop'); renderShop();">🛍️ 상점</button>
            <button onclick="showTab('checkin')">⚔️ 등교</button>
            <button onclick="showTab('points')">💰 포인트·도감</button>
            <button id="btn-blackboard-admin" style="display:none;" onclick="showTab('blackboard-admin'); initBlackboardAdmin();">🏫 전자칠판 관리</button>
            <button onclick="showTab('housing'); openHousingTab();">🏰 방</button>
            <button id="btn-management" style="display:none;" onclick="showTab('management'); renderManagementSub('grades');">🛡️ 학급관리</button>
            <button id="btn-cleaning" style="display:none;" onclick="showTab('cleaning'); renderCleaningMap();">🧹 청소확인</button>
            <button id="btn-admin" style="display:none;" onclick="showTab('admin')">⚙️ 설정</button>
        </nav>

        <div class="main-content-area">
            <!-- 탭 내용들 (기존과 동일하게 유지) -->
            <section id="tab-main" class="tab-content active"><div id="hero-grid" class="hero-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px;"></div></section>
            <!-- ... 나머지 탭 생략 (기존 index.html 구조와 동일하게 유지) ... -->
        </div>
    </div>

    <script>
        // 로딩 화면 강제 해제 안전 장치
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 2000);
        });
    </script>

    <script src="js/firebase-config.js"></script>
    <script src="js/global.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/hero-mgr.js"></script>
    <script src="js/point-shop.js"></script>
    <script src="js/checkin-seat.js"></script>
    <script src="js/housing.js"></script>
    <script src="js/admin-grades.js"></script>
    <script src="js/blackboard.js"></script>
    <script src="js/blackboard-admin.js"></script>
</body>
</html>
