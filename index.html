<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-6 용사 본부</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* 로딩 화면: 어두운 배경과 큼직한 요소 */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #2c3e50; /* 웅장한 어두운 배경 */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 99999; gap: 40px; color: white;
        }
        @keyframes bounceAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .bouncing-text { display: inline-block; animation: bounceAnim 0.8s ease-in-out infinite; font-size: 5rem; font-weight: bold; }
        
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; font-size: 20px !important; }
        #main-app { display: flex !important; flex-direction: row !important; width: 100% !important; min-height: 100vh !important; }
        
        .sidebar-menu { width: 320px !important; min-width: 320px !important; background: #ffffff !important; border-right: 1px solid #e0e0e0 !important; padding: 35px 20px !important; gap: 16px !important; display: flex !important; flex-direction: column !important; }
        .sidebar-menu.collapsed { display: none !important; }
        .sidebar-menu button { padding: 22px 25px !important; font-size: 1.5rem !important; }
        
        .main-content-area { flex: 1 !important; padding: 45px !important; }
        h1 { font-size: 3rem !important; }
        h2 { font-size: 2.5rem !important; }
        h3 { font-size: 2rem !important; }
        p, span, label, input, button, table th, table td { font-size: 1.4rem !important; }
        
        #sidebar-toggle-btn { position: fixed !important; top: 35px !important; left: 320px !important; z-index: 9999 !important; width: 50px !important; height: 75px !important; font-size: 1.8rem !important; }
        #sidebar-toggle-btn.collapsed { left: 0 !important; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-menu');
            const toggleBtn = document.getElementById('sidebar-toggle-btn');
            sidebar.classList.toggle('collapsed');
            toggleBtn.classList.toggle('collapsed');
            toggleBtn.innerText = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        }
    </script>
</head>
<body>
    <!-- 🏰 어두운 배경의 큼직한 로딩 화면 -->
    <div id="loading-screen">
        <div style="font-size: 8rem;">🏰</div>
        <div style="display: flex; gap: 15px;">
            <span class="bouncing-text" style="color: #fff;">용</span><span class="bouncing-text" style="color: #3498db;">사</span>
            <span class="bouncing-text" style="color: #fff;">본</span><span class="bouncing-text" style="color: #e74c3c;">부</span>
            <span class="bouncing-text" style="color: #f1c40f;">접</span><span class="bouncing-text" style="color: #2ecc71;">속</span>
            <span class="bouncing-text" style="color: #bdc3c7;">중</span>
        </div>
    </div>

    <div id="main-app">
        <button id="sidebar-toggle-btn" onclick="toggleSidebar()">◀</button>
        <nav id="sidebar-menu" class="sidebar-menu">
            <h2 style="text-align: center; color: #2c3e50; margin:0;">🏰 6-6 본부</h2>
            <button onclick="showTab('main')">🤺 용사들</button>
            <button onclick="showTab('shop'); renderShop();">🛍️ 상점</button>
            <button onclick="showTab('checkin')">⚔️ 등교</button>
            <button onclick="showTab('points')">💰 포인트·도감</button>
            <button id="btn-blackboard-admin" style="display:none;" onclick="showTab('blackboard-admin'); initBlackboardAdmin();">🏫 전자칠판 관리</button>
            <button onclick="showTab('housing'); openHousingTab();">🏰 방</button>
            <button id="btn-management" style="display:none;" onclick="showTab('management'); renderManagementSub('grades');">🛡️ 학급관리</button>
            <button id="btn-cleaning" style="display:none;" onclick="showTab('cleaning'); renderCleaningMap();">🧹 청소확인</button>
            <button id="btn-admin" style="display:none;" onclick="showTab('admin')">⚙️ 설정</button>
        </nav>

        <div class="main-content-area">
            <!-- 탭 영역... (기존과 동일 구조 유지) -->
        </div>
    </div>

    <script>
        // 안전한 초기화
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 1500);
            if(typeof initApp === 'function') initApp();
        });
    </script>
    <script src="js/firebase-config.js"></script>
    <script src="js/global.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/hero-mgr.js"></script>
    <script src="js/point-shop.js"></script>
    <!-- ...나머지 스크립트 파일... -->
</body>
</html>
