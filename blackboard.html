<!-- blackboard.html -->
<div id="bb-container" style="text-align:center; padding:20px;">
    <h1 id="status-display" style="font-size:3rem;">로딩 중...</h1>
    <div id="missing-students-list" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:20px; margin-top:30px;">
        <!-- 미등교 학생이 여기에 버튼 형태로 뜹니다 -->
    </div>
</div>

<script src="js/firebase-config.js"></script>
<script>
    // 등교 처리 함수 (학생 이름 터치 시 실행)
    function touchCheckIn(name) {
        if(confirm(name + " 용사를 등교 처리할까요?")) {
            db.ref('attendance/' + new Date().toISOString().split('T')[0]).push({ name: name, time: new Date().toLocaleTimeString() });
            alert("등교 완료!");
        }
    }

    // 미등교 학생 실시간 감시
    db.ref('users').on('value', (snap) => {
        const users = snap.val();
        const today = new Date().toISOString().split('T')[0];
        db.ref('attendance/' + today).once('value').then((att) => {
            const checkedIn = att.val() ? Object.values(att.val()).map(a => a.name) : [];
            const container = document.getElementById('missing-students-list');
            container.innerHTML = '';
            
            for(let key in users) {
                if(!checkedIn.includes(users[key].name)) {
                    container.innerHTML += `<button onclick="touchCheckIn('${users[key].name}')" style="padding:40px; font-size:2rem; background:var(--red); color:white; border-radius:20px;">${users[key].name}</button>`;
                }
            }
        });
    });
</script>
